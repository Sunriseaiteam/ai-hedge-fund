# Scenario Maps Configuration
# Maps macro events to market impact scenarios
# Probabilities should sum to 1.0 within each scenario set

recession:
  name: "US Recession Scenarios"
  event_type: "recession"
  source_description: "Default calibration based on historical recession drawdowns"
  scenarios:
    - name: "no_recession"
      probability: 0.65
      spot_shock: 0.05        # SPY +5%
      volatility: 0.16        # 16% annualized vol
      rate_shift: 0.0
      description: "Soft landing / continued expansion"

    - name: "mild_recession"
      probability: 0.20
      spot_shock: -0.12       # SPY -12%
      volatility: 0.25        # 25% vol
      rate_shift: -0.01       # rates drop 100bps
      description: "Mild, short recession like 2001"

    - name: "severe_recession"
      probability: 0.10
      spot_shock: -0.28       # SPY -28%
      volatility: 0.38        # 38% vol
      rate_shift: -0.015
      description: "Significant recession, not a crisis"

    - name: "crisis"
      probability: 0.05
      spot_shock: -0.42       # SPY -42%
      volatility: 0.55        # 55% vol
      rate_shift: -0.02
      description: "Full financial crisis like 2008"


fed_rate_cut:
  name: "Fed Rate Cut Scenarios"
  event_type: "fed_cut"
  source_description: "Scenarios around Fed easing cycle"
  scenarios:
    - name: "no_cut"
      probability: 0.30
      spot_shock: -0.03
      volatility: 0.18
      rate_shift: 0.0
      description: "Fed holds, hawkish surprise"

    - name: "single_cut"
      probability: 0.40
      spot_shock: 0.03
      volatility: 0.15
      rate_shift: -0.0025
      description: "25bp cut, orderly"

    - name: "aggressive_cuts"
      probability: 0.20
      spot_shock: 0.0
      volatility: 0.22
      rate_shift: -0.0075
      description: "Emergency cuts signal distress"

    - name: "crisis_cuts"
      probability: 0.10
      spot_shock: -0.15
      volatility: 0.35
      rate_shift: -0.015
      description: "Emergency cuts with market panic"


tariff_escalation:
  name: "Trade/Tariff Escalation Scenarios"
  event_type: "tariff"
  source_description: "Scenarios for trade war / tariff escalation"
  scenarios:
    - name: "de_escalation"
      probability: 0.30
      spot_shock: 0.08
      volatility: 0.14
      rate_shift: 0.0
      description: "Tariffs rolled back, trade deal"

    - name: "status_quo"
      probability: 0.35
      spot_shock: 0.0
      volatility: 0.18
      rate_shift: 0.0
      description: "Current tariffs persist, no escalation"

    - name: "moderate_escalation"
      probability: 0.25
      spot_shock: -0.10
      volatility: 0.25
      rate_shift: -0.005
      description: "New tariffs, supply chain disruption"

    - name: "full_trade_war"
      probability: 0.10
      spot_shock: -0.22
      volatility: 0.38
      rate_shift: -0.01
      description: "Broad retaliatory tariffs, global slowdown"


government_shutdown:
  name: "Government Shutdown / Debt Ceiling Scenarios"
  event_type: "fiscal"
  source_description: "Scenarios for fiscal brinkmanship"
  scenarios:
    - name: "resolved"
      probability: 0.55
      spot_shock: 0.02
      volatility: 0.15
      rate_shift: 0.0
      description: "Deal reached, markets shrug it off"

    - name: "short_shutdown"
      probability: 0.25
      spot_shock: -0.03
      volatility: 0.20
      rate_shift: 0.001
      description: "Brief shutdown, limited impact"

    - name: "prolonged_crisis"
      probability: 0.15
      spot_shock: -0.10
      volatility: 0.28
      rate_shift: 0.005
      description: "Extended shutdown, credit warning"

    - name: "default_scare"
      probability: 0.05
      spot_shock: -0.25
      volatility: 0.45
      rate_shift: 0.02
      description: "Technical default or near-default"
